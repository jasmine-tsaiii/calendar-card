<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行事曆卡片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg: #14151d;
    --surface: #1b1c26;
    --line: rgba(243, 239, 227, 0.14);
    --line-strong: rgba(243, 239, 227, 0.3);
    --text: #f3efe3;
    --text-dim: #9c9788;
    --gold: #c9a769;
    --teal: #6f9a92;
    --blush: #c98f8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 300;
  }
  #stars {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  .glow {
    position: fixed;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: 480px;
    height: 480px;
    background: radial-gradient(circle, rgba(201,167,105,0.16) 0%, rgba(111,154,146,0.08) 45%, transparent 72%);
    z-index: 0;
    pointer-events: none;
  }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 440px;
    margin: 0 auto;
    padding: 40px 22px 60px;
  }
  .mascot {
    display: block;
    margin: 0 auto 6px;
    width: 84px;
    height: 84px;
  }
  h1 {
    text-align: center;
    font-family: "Noto Serif TC", serif;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 6px;
    margin: 0 0 6px;
    color: var(--text);
  }
  .divider {
    width: 36px;
    height: 1px;
    background: var(--gold);
    margin: 16px auto 16px;
  }
  .subtitle {
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
    letter-spacing: 1px;
    margin-bottom: 36px;
  }
  .field {
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  input[type="text"],
  input[type="date"],
  input[type="time"],
  input[type="url"],
  textarea {
    width: 100%;
    padding: 11px 4px;
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font-family: "Noto Sans TC", sans-serif;
    font-size: 15px;
    outline: none;
    border-radius: 0;
    resize: none;
  }
  textarea { line-height: 1.6; }
  input::placeholder, textarea::placeholder { color: #5e5c56; font-weight: 300; }
  input:focus, textarea:focus { border-bottom-color: var(--gold); }
  ::-webkit-calendar-picker-indicator { filter: invert(0.6) sepia(1) saturate(0) hue-rotate(0deg); opacity: 0.6; }

  .row-two {
    display: flex;
    gap: 20px;
  }
  .row-two .field { flex: 1; }

  .field-hint {
    font-size: 11px;
    color: #6b6862;
    margin-top: 6px;
    letter-spacing: 0.5px;
  }

  button.primary {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-family: "Noto Serif TC", serif;
    font-size: 14px;
    letter-spacing: 4px;
    cursor: pointer;
    margin-top: 12px;
    transition: background 0.2s, color 0.2s;
  }
  button.primary:active { background: var(--gold); color: #14151d; }

  #cardSection {
    display: none;
    margin-top: 44px;
  }
  .card {
    position: relative;
    padding: 36px 28px;
    background: linear-gradient(175deg, #1e1f2b 0%, #1b1c26 60%);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .card::before,
  .card::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1px solid var(--gold);
    opacity: 0.7;
  }
  .card::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .card::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .card-glow {
    position: absolute;
    top: -60px;
    right: -60px;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(201,167,105,0.14) 0%, transparent 70%);
    pointer-events: none;
  }

  .card-eyebrow {
    position: relative;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gold);
    margin-bottom: 14px;
    text-align: center;
  }
  .card-title {
    position: relative;
    font-family: "Noto Serif TC", serif;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 22px;
    word-break: break-word;
    text-align: center;
  }
  .card-divider {
    position: relative;
    width: 24px;
    height: 1px;
    background: var(--line-strong);
    margin: 0 auto 22px;
  }
  .card-row {
    position: relative;
    display: flex;
    gap: 16px;
    font-size: 13.5px;
    color: var(--text);
    margin-bottom: 14px;
    line-height: 1.6;
  }
  .card-row .label {
    flex: 0 0 56px;
    color: var(--teal);
    font-size: 11px;
    letter-spacing: 2px;
    padding-top: 2px;
    text-transform: uppercase;
  }
  .card-row .value { flex: 1; word-break: break-word; }
  .card-row .value a { color: var(--text); text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 3px; }

  .card-desc {
    position: relative;
    font-family: "Noto Serif TC", serif;
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.9;
    text-align: center;
    margin: 4px 0 22px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .card-mochi {
    position: absolute;
    bottom: 10px;
    right: 14px;
    width: 34px;
    height: 34px;
    opacity: 0.85;
  }

  .actions {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.action-btn, button.action-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    padding: 13px;
    font-size: 13px;
    letter-spacing: 2px;
    cursor: pointer;
    border: 1px solid var(--line-strong);
    background: transparent;
    font-family: "Noto Sans TC", sans-serif;
  }
  a.gcal { color: var(--teal); border-color: var(--teal); }
  a.applecal { color: var(--gold); border-color: var(--gold); }
  button.line-share { color: #7cc98f; border-color: #4f7a5a; }
  .hint {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 14px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="glow"></div>
<div class="wrap">
  <svg class="mascot" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="60" cy="72" rx="44" ry="38" fill="#f3efe3" fill-opacity="0.94" stroke="#c9a769" stroke-width="1.5"/>
    <ellipse cx="40" cy="34" rx="15" ry="12" fill="#f3efe3" fill-opacity="0.94" stroke="#c9a769" stroke-width="1.5"/>
    <path d="M55 20 Q60 8 65 20 Q68 12 74 18" fill="none" stroke="#6f9a92" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M42 68 Q47 62 52 68" fill="none" stroke="#4a4738" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M70 68 Q75 62 80 68" fill="none" stroke="#4a4738" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M55 82 Q61 87 67 82" fill="none" stroke="#4a4738" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="38" cy="80" rx="7" ry="4" fill="#c98f8a" opacity="0.55"/>
    <ellipse cx="84" cy="80" rx="7" ry="4" fill="#c98f8a" opacity="0.55"/>
  </svg>
  <h1>行 事 曆 卡 片</h1>
  <div class="divider"></div>
  <p class="subtitle">填好事件，產生一張可分享到 LINE 的卡片</p>

  <form id="eventForm">
    <div class="field">
      <label for="title">標題</label>
      <input type="text" id="title" placeholder="例如：週末爬山" required>
    </div>
    <div class="row-two">
      <div class="field">
        <label for="date">日期</label>
        <input type="date" id="date" required>
      </div>
      <div class="field">
        <label for="time">時間（留空＝整天）</label>
        <input type="time" id="time">
      </div>
    </div>
    <div class="field">
      <label for="location">地點</label>
      <input type="text" id="location" placeholder="例如：象山登山口">
    </div>
    <div class="field">
      <label for="desc">文字說明</label>
      <textarea id="desc" rows="3" placeholder="想多說一點什麼都可以（可留空）"></textarea>
    </div>
    <div class="field">
      <label for="link">連結</label>
      <input type="text" id="link" placeholder="想附上連結的話貼在這裡（可留空）">
    </div>
    <button type="submit" class="primary">產 生 卡 片</button>
  </form>

  <div id="cardSection">
    <div class="card">
      <div class="card-glow"></div>
      <div class="card-eyebrow">E V E N T</div>
      <div class="card-title" id="outTitle"></div>
      <div class="card-divider"></div>
      <div class="card-row"><span class="label">時間</span><span class="value" id="outDate"></span></div>
      <div class="card-row" id="outLocationRow"><span class="label">地點</span><span class="value" id="outLocation"></span></div>
      <div class="card-row" id="outLinkRow"><span class="label">連結</span><span class="value" id="outLink"></span></div>
      <p class="card-desc" id="outDesc"></p>
      <svg class="card-mochi" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="72" rx="44" ry="38" fill="#f3efe3" fill-opacity="0.9" stroke="#c9a769" stroke-width="2"/>
        <ellipse cx="40" cy="34" rx="15" ry="12" fill="#f3efe3" fill-opacity="0.9" stroke="#c9a769" stroke-width="2"/>
        <path d="M42 68 Q47 62 52 68" fill="none" stroke="#4a4738" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M70 68 Q75 62 80 68" fill="none" stroke="#4a4738" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="actions">
      <a id="gcalBtn" class="action-btn gcal" href="#" target="_blank" rel="noopener">加到 Google 行事曆</a>
      <a id="appleCalBtn" class="action-btn applecal" href="#">加到 Apple 行事曆</a>
      <button id="lineShareBtn" class="action-btn line-share" type="button">分享到 LINE</button>
    </div>
    <p class="hint" id="liffHint"></p>
  </div>
</div>

<script>
  // ---- 背景：安靜的細小星點 ----
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const count = Math.floor((canvas.width * canvas.height) / 9000);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 0.9 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.006 + Math.random() * 0.01
    }));
  }

  function drawStars(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      const alpha = 0.15 + 0.3 * Math.abs(Math.sin(s.phase + t * s.speed));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(243,239,227,${alpha})`;
      ctx.fill();
    }
    requestAnimationFrame(drawStars);
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  requestAnimationFrame(drawStars);

  // ---- 表單 → 卡片 ----
  const LIFF_ID = '2011682833-OITqCgj6';

  const form = document.getElementById('eventForm');
  const cardSection = document.getElementById('cardSection');
  const gcalBtn = document.getElementById('gcalBtn');
  const appleCalBtn = document.getElementById('appleCalBtn');
  const lineShareBtn = document.getElementById('lineShareBtn');
  const liffHint = document.getElementById('liffHint');

  let currentEvent = null;

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatDateDisplay(dateStr, timeStr) {
    const [y, m, d] = dateStr.split('-');
    let out = `${y}/${m}/${d}`;
    if (timeStr) out += `　${timeStr}`;
    else out += '（整天）';
    return out;
  }

  function normalizeUrl(str) {
    const s = str.trim();
    return /^https?:\/\//i.test(s) ? s : `https://${s}`;
  }

  function buildGoogleCalendarUrl(ev) {
    const base = 'https://calendar.google.com/calendar/render?action=TEMPLATE';
    const text = encodeURIComponent(ev.title);
    const loc = encodeURIComponent(ev.location || '');
    const details = encodeURIComponent(ev.desc || '');
    let dates;
    if (ev.time) {
      const start = new Date(`${ev.date}T${ev.time}:00`);
      const end = new Date(start.getTime() + 60 * 60 * 1000); // 預設 1 小時
      const fmt = (d) =>
        `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
      dates = `${fmt(start)}/${fmt(end)}`;
    } else {
      const start = new Date(`${ev.date}T00:00:00`);
      const end = new Date(start.getTime() + 24 * 60 * 60 * 1000);
      const fmtDay = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
      dates = `${fmtDay(start)}/${fmtDay(end)}`;
    }
    return `${base}&text=${text}&dates=${dates}&location=${loc}&details=${details}`;
  }

  function formatICSDateUTC(d) {
    return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}${pad(d.getUTCSeconds())}Z`;
  }

  function formatICSDateOnly(d) {
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  }

  function escapeICS(str) {
    return String(str || '')
      .replace(/\\/g, '\\\\')
      .replace(/;/g, '\\;')
      .replace(/,/g, '\\,')
      .replace(/\n/g, '\\n');
  }

  function buildICSDataUrl(ev) {
    const dtstamp = formatICSDateUTC(new Date());
    const uid = `${Date.now()}-${Math.random().toString(36).slice(2)}@calendar-card`;
    let dtStartLine, dtEndLine;
    if (ev.time) {
      const start = new Date(`${ev.date}T${ev.time}:00`);
      const end = new Date(start.getTime() + 60 * 60 * 1000); // 預設 1 小時
      dtStartLine = `DTSTART:${formatICSDateUTC(start)}`;
      dtEndLine = `DTEND:${formatICSDateUTC(end)}`;
    } else {
      const start = new Date(`${ev.date}T00:00:00`);
      const end = new Date(start.getTime() + 24 * 60 * 60 * 1000);
      dtStartLine = `DTSTART;VALUE=DATE:${formatICSDateOnly(start)}`;
      dtEndLine = `DTEND;VALUE=DATE:${formatICSDateOnly(end)}`;
    }
    const descParts = [];
    if (ev.desc) descParts.push(ev.desc);
    if (ev.link) descParts.push(ev.link);

    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//calendar-card//jasmine//TW',
      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `DTSTAMP:${dtstamp}`,
      dtStartLine,
      dtEndLine,
      `SUMMARY:${escapeICS(ev.title)}`
    ];
    if (ev.location) lines.push(`LOCATION:${escapeICS(ev.location)}`);
    if (descParts.length) lines.push(`DESCRIPTION:${escapeICS(descParts.join('\n'))}`);
    lines.push('END:VEVENT', 'END:VCALENDAR');

    return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(lines.join('\r\n'));
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = document.getElementById('title').value.trim();
    const date = document.getElementById('date').value;
    const time = document.getElementById('time').value;
    const location = document.getElementById('location').value.trim();
    const desc = document.getElementById('desc').value.trim();
    const link = document.getElementById('link').value.trim();

    currentEvent = { title, date, time, location, desc, link };

    document.getElementById('outTitle').textContent = title;
    document.getElementById('outDate').textContent = formatDateDisplay(date, time);

    const locRow = document.getElementById('outLocationRow');
    if (location) {
      document.getElementById('outLocation').textContent = location;
      locRow.style.display = 'flex';
    } else {
      locRow.style.display = 'none';
    }

    const linkRow = document.getElementById('outLinkRow');
    if (link) {
      const linkEl = document.getElementById('outLink');
      linkEl.innerHTML = '';
      const a = document.createElement('a');
      a.href = normalizeUrl(link);
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = link;
      linkEl.appendChild(a);
      linkRow.style.display = 'flex';
    } else {
      linkRow.style.display = 'none';
    }

    const descEl = document.getElementById('outDesc');
    descEl.textContent = desc;
    descEl.style.display = desc ? 'block' : 'none';

    gcalBtn.href = buildGoogleCalendarUrl(currentEvent);
    appleCalBtn.href = buildICSDataUrl(currentEvent);
    cardSection.style.display = 'block';
    cardSection.scrollIntoView({ behavior: 'smooth' });
  });

  // ---- LINE 分享 ----
  function buildFlexMessage(ev, gcalUrl) {
    const bodyContents = [
      { type: 'text', text: 'EVENT', color: '#c9a769', size: 'xs', weight: 'bold', align: 'center' },
      { type: 'text', text: ev.title, color: '#f3efe3', size: 'lg', weight: 'bold', wrap: true, margin: 'md', align: 'center' },
      { type: 'separator', margin: 'lg', color: '#33343f' },
      {
        type: 'box',
        layout: 'baseline',
        margin: 'lg',
        contents: [
          { type: 'text', text: '時間', color: '#6f9a92', size: 'xs', flex: 2 },
          { type: 'text', text: formatDateDisplay(ev.date, ev.time), color: '#f3efe3', size: 'sm', flex: 5, wrap: true }
        ]
      }
    ];

    if (ev.location) {
      bodyContents.push({
        type: 'box',
        layout: 'baseline',
        margin: 'md',
        contents: [
          { type: 'text', text: '地點', color: '#6f9a92', size: 'xs', flex: 2 },
          { type: 'text', text: ev.location, color: '#f3efe3', size: 'sm', flex: 5, wrap: true }
        ]
      });
    }

    if (ev.link) {
      bodyContents.push({
        type: 'box',
        layout: 'baseline',
        margin: 'md',
        contents: [
          { type: 'text', text: '連結', color: '#6f9a92', size: 'xs', flex: 2 },
          { type: 'text', text: ev.link, color: '#f3efe3', size: 'sm', flex: 5, wrap: true, decoration: 'underline', action: { type: 'uri', uri: normalizeUrl(ev.link) } }
        ]
      });
    }

    if (ev.desc) {
      bodyContents.push({ type: 'separator', margin: 'lg', color: '#33343f' });
      bodyContents.push({ type: 'text', text: ev.desc, color: '#9c9788', size: 'xs', wrap: true, margin: 'lg' });
    }

    return {
      type: 'flex',
      altText: `${ev.title}｜行事曆邀請`,
      contents: {
        type: 'bubble',
        body: {
          type: 'box',
          layout: 'vertical',
          paddingAll: '20px',
          backgroundColor: '#1b1c26',
          contents: bodyContents
        },
        footer: {
          type: 'box',
          layout: 'vertical',
          backgroundColor: '#1b1c26',
          contents: [
            {
              type: 'button',
              style: 'primary',
              color: '#6f9a92',
              action: { type: 'uri', label: '加到 Google 行事曆', uri: gcalUrl }
            }
          ]
        }
      }
    };
  }

  let liffReady = false;
  liff.init({ liffId: LIFF_ID })
    .then(() => { liffReady = true; })
    .catch((err) => {
      liffHint.textContent = '尚未完成上線設定，分享功能還不能用（先把網頁架到真的網址，並更新 LIFF 的 Endpoint URL）';
      console.error('LIFF init failed', err);
    });

  lineShareBtn.addEventListener('click', async () => {
    if (!currentEvent) return;
    if (!liffReady) {
      liffHint.textContent = '尚未完成上線設定，分享功能還不能用（先把網頁架到真的網址，並更新 LIFF 的 Endpoint URL）';
      return;
    }
    try {
      const gcalUrl = buildGoogleCalendarUrl(currentEvent);
      const msg = buildFlexMessage(currentEvent, gcalUrl);
      const result = await liff.shareTargetPicker([msg]);
      if (result) {
        liffHint.textContent = '已送出分享！';
      } else {
        liffHint.textContent = '已取消分享';
      }
    } catch (err) {
      const os = liff.getOS ? liff.getOS() : '未知';
      const ver = liff.getLineVersion ? liff.getLineVersion() : '未知';
      liffHint.textContent = `分享失敗：${err && err.message ? err.message : err}（系統：${os}／LINE版本：${ver}）`;
      console.error(err);
    }
  });
</script>
</body>
</html>
